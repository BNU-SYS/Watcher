"share/detector/skills/php/rules" = ["skills/php/rules/CWE-22.md", "skills/php/rules/CWE-352.md", "skills/php/rules/CWE-434.md", "skills/php/rules/CWE-470.md", "skills/php/rules/CWE-502.md", "skills/php/rules/CWE-78.md", "skills/php/rules/CWE-79.md", "skills/php/rules/CWE-862.md", "skills/php/rules/CWE-89.md", "skills/php/rules/CWE-918.md", "skills/php/rules/CWE-94.md", "skills/php/rules/CWE-98.md"]
"share/detector/skills/python" = ["skills/python/SHORT_SKILL.md", "skills/python/SKILL.md", "skills/python/manifest.json"]
